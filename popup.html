<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hard Reload All Tabs</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 280px;
      background: #0f0f17;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      padding: 18px 18px 0;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(124, 58, 237, 0.55);
    }

    .logo svg {
      width: 18px;
      height: 18px;
      stroke: #fff;
    }

    .header-title {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: 0.1px;
    }

    .header-sub {
      font-size: 10px;
      color: #4b5563;
      font-weight: 400;
      margin-top: 2px;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #2e1065 30%, #3b0764 60%, transparent);
      margin: 15px 0;
    }

    /* ── Stats ── */
    .stats {
      display: flex;
      gap: 8px;
      padding: 0 18px;
      margin-bottom: 14px;
    }

    .stat-card {
      flex: 1;
      background: #161624;
      border: 1px solid #1e1b4b;
      border-radius: 10px;
      padding: 9px 6px;
      text-align: center;
    }

    .stat-value {
      font-size: 21px;
      font-weight: 700;
      line-height: 1;
      color: #a78bfa;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      font-size: 9px;
      font-weight: 500;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 4px;
    }

    /* ── Button ── */
    .btn-wrap {
      padding: 0 18px;
    }

    #reloadBtn {
      width: 100%;
      padding: 12px 0;
      font-size: 13.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 50%, #4c1d95 100%);
      color: #fff;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      box-shadow: 0 4px 22px rgba(124, 58, 237, 0.5), 0 1px 4px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #reloadBtn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.13) 0%, transparent 55%);
    }

    #reloadBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(124, 58, 237, 0.65), 0 2px 8px rgba(0,0,0,0.5);
    }

    #reloadBtn:active:not(:disabled) {
      transform: scale(0.975);
      box-shadow: 0 2px 12px rgba(124, 58, 237, 0.4);
    }

    #reloadBtn:disabled {
      opacity: 0.65;
      cursor: default;
    }

    .btn-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke: #fff;
    }

    .btn-icon.spinning {
      animation: spin 0.65s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Progress bar ── */
    .progress-bar {
      height: 2px;
      background: #1a1a2e;
      margin-top: 14px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7c3aed, #c4b5fd);
      transition: width 0.25s ease;
      border-radius: 2px;
    }

    .progress-fill.indeterminate {
      width: 38%;
      animation: progress-slide 0.9s ease-in-out infinite;
    }

    @keyframes progress-slide {
      0%   { transform: translateX(-130%); }
      100% { transform: translateX(350%); }
    }

    /* ── Status ── */
    .status-wrap {
      padding: 10px 18px 18px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #status {
      font-size: 11.5px;
      font-weight: 500;
      text-align: center;
      line-height: 1.5;
      transition: opacity 0.2s;
    }

    #status.idle    { color: #4b5563; }
    #status.loading { color: #818cf8; }
    #status.success { color: #34d399; }
    #status.error   { color: #f87171; }

    @keyframes flash-success {
      0%   { box-shadow: 0 4px 22px rgba(52,211,153,0.0), 0 1px 4px rgba(0,0,0,0.5); }
      40%  { box-shadow: 0 4px 32px rgba(52,211,153,0.5), 0 1px 4px rgba(0,0,0,0.5); }
      100% { box-shadow: 0 4px 22px rgba(124,58,237,0.5), 0 1px 4px rgba(0,0,0,0.5); }
    }

    /* ── Options section ── */
    .options {
      padding: 0 18px;
      margin-bottom: 14px;
    }

    .option-row {
      background: #161624;
      border: 1px solid #1e1b4b;
      border-radius: 10px;
      overflow: hidden;
    }

    .option-row + .option-row {
      margin-top: 8px;
    }

    .option-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 13px;
      cursor: pointer;
    }

    .option-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .option-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: #1e1b4b;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .option-icon svg {
      width: 14px;
      height: 14px;
      stroke: #818cf8;
    }

    .option-label {
      font-size: 12px;
      font-weight: 600;
      color: #c4b5fd;
    }

    .option-desc {
      font-size: 10px;
      color: #4b5563;
      margin-top: 2px;
    }

    /* ── Toggle switch ── */
    .toggle {
      position: relative;
      width: 34px;
      height: 20px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: #1e1b4b;
      border-radius: 20px;
      border: 1px solid #2e2870;
      transition: background 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #475569;
      transition: transform 0.2s, background 0.2s;
      pointer-events: none;
    }

    .toggle input:checked + .toggle-track {
      background: #5b21b6;
      border-color: #7c3aed;
    }

    .toggle input:checked + .toggle-track .toggle-thumb {
      transform: translateX(14px);
      background: #c4b5fd;
    }

    /* ── Delay slider panel ── */
    .delay-panel,
    .excl-panel {
      padding: 0 13px 12px;
      display: none;
    }

    .delay-panel.visible,
    .excl-panel.visible {
      display: block;
    }

    .delay-sep {
      height: 1px;
      background: #1e1b4b;
      margin-bottom: 11px;
    }

    .delay-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .delay-hint {
      font-size: 10px;
      color: #4b5563;
    }

    .delay-value {
      font-size: 12px;
      font-weight: 700;
      color: #a78bfa;
      font-variant-numeric: tabular-nums;
    }

    .delay-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 4px;
      background: #1e1b4b;
      outline: none;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .delay-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(124, 58, 237, 0.6);
      border: 2px solid #c4b5fd;
      transition: transform 0.15s;
    }

    .delay-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .delay-presets {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }

    .preset-btn {
      flex: 1;
      padding: 4px 0;
      font-size: 10px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid #2e2870;
      border-radius: 6px;
      background: #1a1a2e;
      color: #6b7280;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .preset-btn:hover {
      background: #2e1065;
      color: #c4b5fd;
      border-color: #5b21b6;
    }

    .preset-btn.active {
      background: #2e1065;
      color: #c4b5fd;
      border-color: #7c3aed;
    }

    /* ── Excluded sites ── */
    .excl-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .excl-count {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 10px;
      background: #1e1b4b;
      border: 1px solid #2e2870;
      color: #a78bfa;
      font-size: 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chevron {
      width: 14px;
      height: 14px;
      stroke: #6b7280;
      transition: transform 0.2s;
    }

    .option-header.open .chevron {
      transform: rotate(180deg);
    }

    .excl-form {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .excl-input {
      flex: 1;
      min-width: 0;
      padding: 6px 9px;
      font-size: 11px;
      font-family: inherit;
      background: #0f0f17;
      color: #e2e8f0;
      border: 1px solid #2e2870;
      border-radius: 7px;
      outline: none;
      transition: border-color 0.15s;
    }

    .excl-input::placeholder {
      color: #374151;
    }

    .excl-input:focus {
      border-color: #7c3aed;
    }

    .excl-add {
      padding: 0 11px;
      font-size: 11px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid #5b21b6;
      border-radius: 7px;
      background: #2e1065;
      color: #c4b5fd;
      transition: background 0.15s, border-color 0.15s;
    }

    .excl-add:hover {
      background: #3b0764;
      border-color: #7c3aed;
    }

    .excl-list {
      list-style: none;
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .excl-list::-webkit-scrollbar {
      width: 4px;
    }

    .excl-list::-webkit-scrollbar-thumb {
      background: #2e2870;
      border-radius: 4px;
    }

    .excl-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 4px 4px 9px;
      background: #1a1a2e;
      border: 1px solid #1e1b4b;
      border-radius: 7px;
      flex-shrink: 0;
    }

    .excl-url {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      color: #c4b5fd;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .excl-remove {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: #6b7280;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .excl-remove:hover {
      background: #3f1d2e;
      color: #f87171;
    }

    .excl-empty {
      font-size: 10px;
      color: #4b5563;
      text-align: center;
      line-height: 1.5;
      padding: 2px 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74"/>
        <path d="M3 3v5h5"/>
      </svg>
    </div>
    <div>
      <div class="header-title">Hard Reload All Tabs</div>
      <div class="header-sub">Bypass cache · force refresh</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="tabCount">—</div>
      <div class="stat-label">Tabs</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="windowCount">—</div>
      <div class="stat-label">Windows</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="lastCount">—</div>
      <div class="stat-label">Last</div>
    </div>
  </div>

  <div class="options">
    <div class="option-row">
      <div class="option-header" id="delayHeader">
        <div class="option-header-left">
          <div class="option-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7v5l3 3"/>
            </svg>
          </div>
          <div>
            <div class="option-label">Sequential Delay</div>
            <div class="option-desc">Reload tabs one by one with a pause</div>
          </div>
        </div>
        <label class="toggle" id="delayLabel">
          <input type="checkbox" id="delayToggle" />
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </label>
      </div>
      <div class="delay-panel" id="delayPanel">
        <div class="delay-sep"></div>
        <div class="delay-top">
          <span class="delay-hint">Pause between tabs</span>
          <span class="delay-value" id="delayDisplay">100 ms</span>
        </div>
        <input type="range" class="delay-slider" id="delaySlider"
               min="50" max="1000" step="50" value="100" />
        <div class="delay-presets">
          <button class="preset-btn" data-val="50">50ms</button>
          <button class="preset-btn active" data-val="100">100ms</button>
          <button class="preset-btn" data-val="250">250ms</button>
          <button class="preset-btn" data-val="500">500ms</button>
          <button class="preset-btn" data-val="1000">1s</button>
        </div>
      </div>
    </div>

    <div class="option-row">
      <div class="option-header" id="exclHeader">
        <div class="option-header-left">
          <div class="option-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M5.6 5.6l12.8 12.8"/>
            </svg>
          </div>
          <div>
            <div class="option-label">Excluded Sites</div>
            <div class="option-desc">Never reload matching tabs</div>
          </div>
        </div>
        <div class="excl-meta">
          <span class="excl-count" id="exclCount">0</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </div>
      </div>
      <div class="excl-panel" id="exclPanel">
        <div class="delay-sep"></div>
        <form class="excl-form" id="exclForm">
          <input type="text" class="excl-input" id="exclInput"
                 placeholder="https://www.youtube.com/" spellcheck="false" autocomplete="off" />
          <button type="submit" class="excl-add">Add</button>
        </form>
        <ul class="excl-list" id="exclList"></ul>
      </div>
    </div>
  </div>

  <div class="btn-wrap">
    <button id="reloadBtn">
      <svg class="btn-icon" id="btnIcon" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74"/>
        <path d="M3 3v5h5"/>
      </svg>
      <span id="btnLabel">Reload All Tabs</span>
    </button>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="status-wrap">
    <div id="status" class="idle">Click to hard reload all open tabs</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
